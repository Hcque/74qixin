<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生网页制作作品展示</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei";
            background-color: #f4f7f6;
        }

        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: #333;
            border-top: 5px solid #667eea;
            transition: 0.3s;
        }

        .card:hover { transform: translateY(-6px); }

        .btn {
            margin-top: 10px;
            display: inline-block;
            padding: 6px 16px;
            background: #667eea;
            color: white;
            border-radius: 20px;
        }

        .actions { margin-top: 15px; }

        .actions button {
            margin: 5px;
            padding: 6px 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #eee;
        }

        .actions button:hover { background: #ddd; }
    </style>
</head>

<body>

<header>
    <h1>🎨 学生网页制作作品展示</h1>
    <p>点击卡片进入主页，给喜欢的作品点赞吧！</p>
</header>

<div class="container">
    <div class="grid">

<script>
function like(id, type) {
    let key = id + "_" + type;
    let count = localStorage.getItem(key) || 0;
    count++;
    localStorage.setItem(key, count);
    document.getElementById(key).innerText = count;
}

function loadCount(id) {
    ["like", "smile"].forEach(type => {
        let key = id + "_" + type;
        let val = localStorage.getItem(key) || 0;
        document.getElementById(key).innerText = val;
    });
}
</script>

<a href="74第1小组/主页.html" class="card">

        👍 <span id="g1_like">0</span>
        <button onclick="like('g1','like')">点赞</button><br>
        😊 <span id="g1_smile">0</span>
        <button onclick="like('g1','smile')">笑脸</button>

</a>
