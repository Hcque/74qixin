<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR与AR的区别</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0221;color:#fff;padding:30px;font-family:Arial}
.container{max-width:1000px;margin:auto}
h1{color:#00ffff;margin-bottom:20px}
.card{background:rgba(255,255,255,0.07);padding:20px;border-radius:15px;margin:15px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
</style>
</head>
<body>
<div class="container">
<h1>VR 与 AR 的区别</h1>
<div class="grid">
    <div class="card">
        <h2>VR（虚拟现实）</h2>
        <p>✅ 完全沉浸：封闭虚拟世界</p>
        <p>✅ 必须佩戴VR头显</p>
        <p>✅ 案例：VR游戏、虚拟影院</p>
        <p>特征：看不见现实世界</p>
    </div>
    <div class="card">
        <h2>AR（增强现实）</h2>
        <p>✅ 虚实结合：现实+虚拟叠加</p>
        <p>✅ 手机/平板即可实现</p>
        <p>✅ 案例：宝可梦GO、拍照贴纸</p>
        <p>特征：能看到真实环境</p>
    </div>
</div>
<a href="index.html" style="color:#00ffff">← 返回主页</a>
</div>
</body>
</html>
