<div class="card">
  <h3>✨ 交友第一条：真诚永远最动人</h3>
  不必伪装，不必讨好，舒服的关系来自真实。<br><br>

  <h3>✨ 交友第二条：学会倾听</h3>
  多说“我听你说”，少说“我觉得”，理解比建议更重要。<br><br>

  <h3>✨ 交友第三条：尊重边界</h3>
  不强迫、不控制，每个人都有自己的节奏和空间。<br><br>

  <h3>✨ 交友第四条：温和表达自己</h3>
  不舒服可以说，不喜欢可以拒绝，真诚的拒绝胜过勉强的迎合。<br><br>

  <h3>✨ 交友第五条：慢慢来</h3>
  好朋友不是一天长成的，像小树一样，陪伴才会长大。
